openapi: "3.0.0"
info:
  version: 1.0.0
  title: Swagger Petstore   # a comment
  description: >
    A sample API that uses a petstore
    as an example.
servers:
  - url: https://{env}.petstore.example.com/v1
    variables:
      env:
        default: api
paths:
  /pets:
    get:
      summary: List all pets
      operationId: listPets
      tags:
        - pets
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            example: 10
      responses:
        '200':
          description: A paged array of pets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pets'
    post:
      summary: Create a pet
      operationId: createPets
      tags: [pets]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Pet"
      responses:
        '201':
          description: Null response
  /pets/{petId}:
    get:
      summary: Info for a specific pet
      operationId: showPetById
      tags:
        - pets
      parameters:
        - name: petId
          in: path
          required: true
          description: The id of the pet to retrieve
          schema:
            type: string
          example: "7"
      responses:
        '200':
          description: Expected response to a valid request
  /store/inventory:
    get:
      operationId: getInventory
      tags: [store]
      responses:
        "200":
          description: ok
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Pet:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
          example: Rex
        tag:
          type: string
          enum: [dog, cat]
        notes:
          type: string
          description: |
            Free text.
            Two lines.
    Pets:
      type: array
      items:
        $ref: "#/components/schemas/Pet"
